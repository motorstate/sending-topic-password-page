<!doctype html>
<!-- Старая страница выдачи паролей (motorstate.github.io/sending-topic-password-page) после
     перехода: перенаправляет на pass.motorstate.com.ua, сохраняя тему и язык. Ключ вебхука
     (token) из адреса не передаётся никуда. Заменить этим файлом index.html в репозитории
     sending-topic-password-page; script.js и styles.css можно удалить. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>MotorState</title>
    <script>
      ;(function () {
        var params = new URLSearchParams(location.search)
        var topic = params.get('topic') || ''
        var lang = (params.get('lang') || '').toLowerCase()
        var target = 'https://pass.motorstate.com.ua/'
        if (/^[A-Za-z0-9-]{4,64}$/.test(topic)) target += 'g/' + topic
        if (['en', 'ru', 'uk'].indexOf(lang) >= 0) target += '?lang=' + lang
        location.replace(target)
      })()
    </script>
  </head>
  <body>
    <p><a href="https://pass.motorstate.com.ua/">pass.motorstate.com.ua</a></p>
  </body>
</html>
